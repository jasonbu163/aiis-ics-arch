# Source-mounted development stack with backend/frontend hot reload.
name: aiis-ics-arch-dev

x-backend-dev: &backend-dev
  image: aiis-ics-arch-dev-backend:local
  build:
    context: ./backend
    dockerfile: Dockerfile.dev
  env_file:
    - ./backend/.env.docker.dev
  volumes:
    - ./backend:/app
    - backend_venv:/app/.venv
    - backend_uv_cache:/root/.cache/uv
  networks:
    - dev

services:
  mysql:
    image: mysql:8.4.6
    restart: unless-stopped
    env_file:
      - ./backend/.env.docker.dev
    environment:
      MYSQL_ROOT_HOST: "%"
    ports:
      - "${DEV_MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - dev
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_ROOT_USER:-root} -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  migration:
    <<: *backend-dev
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    command: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]

  bootstrap:
    <<: *backend-dev
    profiles: ["bootstrap"]
    restart: "no"
    depends_on:
      migration:
        condition: service_completed_successfully
    command: ["uv", "run", "--no-sync", "python", "scripts/maintenance/ensure_admin_user.py"]

  backend:
    <<: *backend-dev
    restart: unless-stopped
    depends_on:
      migration:
        condition: service_completed_successfully
    ports:
      - "${DEV_BACKEND_HOST_PORT:-8000}:8000"
    command: ["uv", "run", "--no-sync", "python", "run.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; response = httpx.get('http://127.0.0.1:8000/health', timeout=3); response.raise_for_status()"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  frontend:
    image: aiis-ics-arch-dev-frontend:local
    build:
      context: ./frontend-js
      dockerfile: Dockerfile.dev
    env_file:
      - ./frontend-js/.env.docker.dev
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "${DEV_FRONTEND_HOST_PORT:-5190}:5190"
    volumes:
      - ./frontend-js:/app
      - frontend_node_modules:/app/node_modules
    networks:
      - dev
    command: ["pnpm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5190"]
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:5190/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

networks:
  dev:
    driver: bridge

volumes:
  mysql_data:
  backend_venv:
  backend_uv_cache:
  frontend_node_modules:
