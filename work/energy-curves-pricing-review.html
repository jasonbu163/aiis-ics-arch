          ['能耗样本',c('energy_consumption_main'),routes('meter_id, group_key, observed_at','interval_start_at, interval_end_at','local_values, quality, review_mark','ingest_receipt_id → energy_ingest_receipts.id')],
          ['能耗指标',c('energy_metric_configs'),c('meter_id + group_key + metric_key')+' 为主键。同表计和组内以 '+c('slot_no')+' 对应样本 JSON 槽位。'+routes('measurement_mode, unit, rules','list_visible, list_order')],
          ['能耗回执',c('energy_ingest_receipts'),c('target=energy')+'。以 '+c('target + producer_id + event_id')+' 去重，记录结果及样本 ID。'],
          ['能耗单价',routes('energy_price_hours','energy_prices（历史保留）'),c('hour_start')+' 唯一，现用小时表记录同一小时的电、氢气、氩气整组价格。'],
          ['能耗写入登记（已上线 dev）',c('energy_write_sources'),routes('source_key, name, enabled','created_at, updated_at, deleted_at')+'<br>保存能耗来源登记。'],
          ['多表回执（已上线 dev）',c('energy_ingest_receipts'),c('result_detail')+' 保存批次中的表计／采样组／记录 ID 清单。每条样本引用同一批回执。'],
          ['能耗曲线设置（拟新增）','能耗自己的曲线配置表','曲线组键、表计、采样组、指标清单、线型、排序、启停。原有样本表继续用于查询。'],
          ['单价项目（拟新增）',c('energy_price_items'),routes('item_key, name, unit, sort_order, enabled')+'<br>启用时同步生成现价卡片、录入字段和历史列。'],
          ['动态小时单价（拟新增）',c('energy_price_item_hours'),routes('hour_start + item_key','price, observed_at, operator')+'<br>同一项目同一小时更新该项目的价格。旧整组小时价格方案继续列入兼容设计。']
        ])}</section>
        <section class="ep-card"><h2>样本值如何对应指标</h2>${referenceTable(['实时／过程','能耗'],[
          [c('local_values: {"heatZone1":{"01":810.2}}')+'<br>按写入目标、区域和槽号找回 '+c('zone1Actual')+'。',
           c('local_values: {"02":120}')+'<br>结合 '+c('meter_id=meter-01')+' 和 '+c('group_key=electricity')+'，将槽号 '+c('02')+' 解读为 '+c('intervalEnergy')+'。']
        ])}</section>`;
      function renderView() {
        const isUI = view==='ui';
        $('.ep-shell').hidden = !isUI;
        reference.hidden = isUI;
        reference.innerHTML = isUI ? '' : {flow,api:apiPanels(),db}[view];
        root.querySelectorAll('button[data-view]').forEach(item=>item.setAttribute('aria-pressed',String(item.dataset.view===view)));
        $('.ep-example-label').hidden = !isUI || !sampleView();
      }
      root.addEventListener('click', event=>{
        const target=event.target.closest('button');
        if(!target) return;
        const {page:next,tab,latestTab:nextLatestTab,view:nextView,action}=target.dataset;
        if(target.hasAttribute('data-close')) closeDialog();
        if(next){page=next;render();remember();}
        if(tab){configTab=tab;render();remember();}
        if(nextLatestTab){latestTab=nextLatestTab;render();}
        if(nextView){view=nextView;renderView();remember();}
        if(target.dataset.packet){apiMode=target.dataset.packet;renderView();$('[data-packet="'+apiMode+'"]').focus();}
        if(action==='remove-curve-line') target.closest('.ep-curve-line').remove();
        if(action==='query') runQuery();
        if(action==='reset'){
          if(page==='stats'){selectedCurve='按表计查询';render();}
          else{fields.reset();runQuery();}
        }
        if(action==='refresh'){showResults();$('.ep-updated').textContent='刷新于 '+now();}
        if(action==='widths'){delete tableWidths[tableKey()]; showResults();}
        if(action==='save') saveDialog();
        if(action==='add') edit();
        if(action?.startsWith('row-')) edit(Number(action.slice(4)));
        if(action?.startsWith('toggle-')) changeSource(Number(action.slice(7)),false);
        if(action?.startsWith('delete-')) changeSource(Number(action.slice(7)),true);
      });
      fields.addEventListener('change',event=>{
        if(page!=='stats'||event.target.name!=='curve') return;
        selectedCurve=event.target.value;
        const range=[fields.elements.from.value,fields.elements.to.value];
        render();
        fields.elements.from.value=range[0];
        fields.elements.to.value=range[1];
        runQuery();
        fields.elements.curve.focus();
      });
      $('.ep-example').addEventListener('change',event=>{example=event.target.value;render();});
      dialog.addEventListener('click',event=>{if(event.target===dialog) closeDialog();});
      content.addEventListener('pointerdown',event=>{
        const dragging = event.target.closest('.ep-resize');
        if(!dragging) return;
        event.preventDefault();
        dragging.setPointerCapture(event.pointerId);
        const header = dragging.parentElement;
        const key = tableKey();
        const original = header.getBoundingClientRect().width;
        const startX = event.clientX;
        const move = next=>{
          const width = Math.max(70,Math.round(original+next.clientX-startX));
          (tableWidths[key] ??= {})[dragging.dataset.column] = width;
          header.style.minWidth = width+'px';
        };
        dragging.addEventListener('pointermove',move);
        dragging.addEventListener('lostpointercapture',()=>dragging.removeEventListener('pointermove',move),{once:true});
      });
      function runQuery() {
        applied=Object.fromEntries(new FormData(fields));
        showResults();
        if(page==='stats') $('.ep-updated').textContent=applied.meter;
      }
      function saveDialog() {
        const form=$('.ep-dialog-form');
        const invalid=$('.ep-dialog-fields [role="alert"]');
        const outcome=saveEdit(Object.fromEntries(new FormData(form)));
        if(outcome===false||typeof outcome==='string'){
          const message=typeof outcome==='string'?outcome:'请填写必填字段。';
          if(invalid) invalid.textContent=message;
          else $('.ep-dialog-fields').insertAdjacentHTML('beforeend',`<div class="ep-wide" role="alert">${esc(message)}</div>`);
          return;
        }
        closeDialog();
        showResults();
      }
      for(const [form,submit] of [[fields,runQuery],[$('.ep-dialog-form'),saveDialog]]) {
        form.addEventListener('submit',event=>{event.preventDefault();submit();});
        form.addEventListener('keydown',event=>{
          if(event.key!=='Enter'||event.isComposing||event.target.tagName!=='INPUT') return;
          event.preventDefault();
          submit();
        });
      }
      render();
      renderView();
      window.addEventListener('openai:set_globals',event=>{
        const next=event.detail?.globals?.widgetState?.modelContent;
        if(!next) return;
        if(Object.hasOwn(pages,next.page)) page=next.page;
        if(configurationTabs.some(([key])=>key===next.configTab)) configTab=next.configTab;
        if(['ui','flow','api','db'].includes(next.view)) view=next.view;
        render();
        renderView();
      });
    })();
  </script>
</div>
