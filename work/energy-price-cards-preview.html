<div id="aiis-energy-price-review" lang="zh-CN">
  <div class="ep-review">
    <div class="ep-segments" role="group" aria-label="审阅视图">
      <button type="button" data-view="ui" aria-pressed="true">界面</button>
      <button type="button" data-view="flow" aria-pressed="false">原理图</button>
      <button type="button" data-view="api" aria-pressed="false">接口</button>
      <button type="button" data-view="db" aria-pressed="false">数据表</button>
    </div>
    <span>交互原型 · 示例数据</span>
  </div>
  <div class="ep-shell">
    <nav aria-label="主菜单">
      <div class="ep-navigation">
        <div class="ep-module">
          <div class="ep-group"><i data-lucide="panels-top-left" aria-hidden="true"></i>设备状态</div>
          <button data-page="latest">温控工艺</button>
          <button data-page="latest-data">数据管理</button>
          <button data-page="latest-config">配置管理</button>
        </div>
        <div class="ep-module">
          <div class="ep-group"><i data-lucide="monitor" aria-hidden="true"></i>过程监控</div>
          <button data-page="process">温度曲线</button>
          <button data-page="process-config">配置管理</button>
          <button data-page="process-data">数据管理</button>
        </div>
        <div class="ep-module">
          <div class="ep-group"><i data-lucide="zap" aria-hidden="true"></i>能耗管理</div>
          <button data-page="stats">能耗统计</button>
          <button data-page="price" aria-current="page">能耗单价</button>
          <button data-page="samples">数据管理</button>
          <button data-page="config">配置管理</button>
        </div>
      </div>
      <div class="ep-brand">AIIS<span>ICS Architecture</span></div>
    </nav>
    <main class="ep-main">
      <header class="ep-top">
        <div class="ep-crumb"></div>
        <div class="ep-user"><span class="ep-avatar"><i data-lucide="user-round" aria-hidden="true"></i></span>管理员</div>
      </header>
      <div class="ep-workspace">
        <div class="ep-upper" hidden></div>
        <section class="ep-card">
          <header class="ep-card-head"><h2></h2><div class="ep-actions"></div></header>
          <form class="ep-filters"></form>
          <div class="ep-content"></div>
        </section>
      </div>
    </main>
  </div>
  <section class="ep-reference" aria-label="设计对照" hidden></section>
  <dialog>
    <form class="ep-dialog-form">
      <header class="ep-card-head"><h2></h2><button type="button" data-close aria-label="关闭">×</button></header>

      <footer><button type="button" data-close>取消</button><button type="button" class="ep-primary" data-action="save">保存示例</button></footer>
    </form>
  </dialog>

  <script>
    (() => {
      const root = document.getElementById('aiis-energy-price-review');
      const $ = selector => root.querySelector(selector);
      const upper = $('.ep-upper');
      const fields = $('.ep-filters');
      const content = $('.ep-content');
      const reference = $('.ep-reference');
      const dialog = $('dialog');
      const saved = window.openai?.widgetState?.modelContent;
      const pages = {stats:'能耗统计',price:'能耗单价',samples:'数据管理',config:'配置管理',
        latest:'温控工艺','latest-data':'数据管理','latest-config':'配置管理',
        process:'温度曲线','process-config':'配置管理','process-data':'数据管理'};
      let page = Object.hasOwn(pages, saved?.page) ? saved.page : 'price';
      let configTab = saved?.configTab === 'source' ? 'source' : 'metric';
      let latestTab = '区域配置';
      let view = ['ui','flow','api','db'].includes(saved?.view) ? saved.view : 'ui';
      let saveEdit;
      let applied = {};
      const day = '2026-11-23';
      const start = day + 'T08:00', end = day + 'T12:00';
      const meters = ['1 号电表','2 号电表'];
      const unitModes = ['累计读数','时段增量','瞬时读数'];
      const samples = [
        ['1048',meters[0],'electricity','12:00:00','良好','已复核','12680.0','120.0','32.8',''],
        ['1047',meters[0],'electricity','11:00:00','良好','—','12560.0','104.0','25.4',''],
        ['1046',meters[0],'electricity','10:00:00','良好','—','12456.0','116.0','34.6',''],
        ['1045',meters[0],'electricity','09:00:00','良好','—','12340.0','100.0','27.2',''],
        ['1044',meters[0],'electricity','08:00:00','良好','—','12240.0','—','20.4','起始读数'],
        ['1043',meters[1],'electricity','12:00:00','良好','—','9820.0','81.0','21.3','']

      const metricNames = ['累计电量','时段用电量','瞬时功率'];
      const metricKeys = ['totalEnergy','intervalEnergy','activePower'];
      const metrics = meters.flatMap(meter => metricNames.map((name,i) => [meter,'electricity',metricKeys[i],name,unitModes[i],i===2?'kW':'kWh','启用',String(i+1),'显示','']));
      const sources = [['sma-energy-01','配电柜采集',meters[0],'electricity','启用']];
      const curves = [['heatingTemperature','温度曲线','加热区温度','实际温度 / 设定温度','启用']];
      const processSamples = [['2081','000042','温控采集','heatZone1','12:00:00','良好','已复核','810.2','']];
      const latestSamples = [['601','000042','温控采集','heatZone1','12:00:00','良好','810.2','815.0','']];
      const latestSettings = {
        区域配置:{headers:['区域键','类别','中文名称','状态'],rows:[['heatZone1','温控','加热一区','启用']]},

        槽位设置:{headers:['写入目标','采样组','槽位','指标键'],rows:[['latest','heatZone1','01','zone1Actual'],['history','heatZone1','01','zone1Actual']]},
        卡片设置:{headers:['卡片键','页面','标题','指标'],rows:[['heatingTemperature','温控工艺','加热一区','实际温度 / 设定温度']]},
        写入登记:{headers:['来源标识','名称','状态'],rows:[['sma-temp-01','温控采集','启用']]}
      };
      const prices = [['12:00','0.83','3.12','4.20','管理员',day],['11:00','0.76','3.12','4.20','管理员',day]];
      const tableWidths = {};
      const tableKey = () => page === 'config' ? page + '-' + configTab : page;
      const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const button = (label, action, primary = false) => `<button type="button" data-action="${action}"${primary?' class="ep-primary"':''}>${label}</button>`;
      const label = (caption, html, wide = false) => `<label${wide?' class="ep-wide"':''}>${caption}${html}</label>`;
      const select = (caption,name,options,value) => label(caption,`<select name="${name}">${options.map(option=>`<option${value===option?' selected':''}>${esc(option)}</option>`).join('')}</select>`);
      const input = (caption,name,value='',type='text') => label(caption,`<input name="${name}" value="${esc(value)}" type="${type}">`);
      const queryButton = button('查询','query',true);
      const search = queryButton + button('重置','reset');
      const now = () => new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date());

          ['实时／过程共用',routes('observation_write_sources','observation_ingest_receipts'),c('source_key')+' 为登记主键，实际写入以稳定内部标识归属。回执以 '+c('target + producer_id + event_id')+' 去重。'],
          ['实时／过程配置',routes('observation_metric_groups','observation_metric_configs','observation_metric_slot_bindings'),c('target + group_key + slot_no')+' 定义槽位绑定，区分实时和过程两个写入目标。'],
          ['显示配置',routes('equipment_card_configs','monitor_curve_group_configs'),c('items')+' 保存实时卡片指标。'+c('series')+' 保存过程曲线系列。'],
          ['能耗样本',c('energy_consumption_main'),routes('meter_id, group_key, observed_at','interval_start_at, interval_end_at','local_values, quality, review_mark','ingest_receipt_id → energy_ingest_receipts.id')],
          ['能耗指标',c('energy_metric_configs'),c('meter_id + group_key + metric_key')+' 为主键。同表计和组内以 '+c('slot_no')+' 对应样本 JSON 槽位。'+routes('measurement_mode, unit, rules','list_visible, list_order')],
          ['能耗回执',c('energy_ingest_receipts'),c('target=energy')+'。以 '+c('target + producer_id + event_id')+' 去重，记录结果及样本 ID。'],
          ['能耗单价',routes('energy_price_hours','energy_prices（历史保留）'),c('hour_start')+' 唯一，现用小时表记录同一小时的电、氢气、氩气整组价格。'],
          ['能耗写入登记','拟增加', '候选字段为来源标识、名称、启用和允许的表计／采样组。现有表计和读范围来自部署配置的 '+c('meters / meterReadScopes')+'，写授权来自 '+c('energyGrants')+'。登记与生产者身份的绑定方式待定。']
        ])}</section>
        <section class="ep-card"><h2>样本值如何对应指标</h2>${referenceTable(['实时／过程','能耗'],[
          [c('local_values: {"heatZone1":{"01":810.2}}')+'<br>按写入目标、区域和槽号找回 '+c('zone1Actual')+'。',
           c('local_values: {"02":120}')+'<br>结合 '+c('meter_id=meter-01')+' 和 '+c('group_key=electricity')+'，将槽号 '+c('02')+' 解读为 '+c('intervalEnergy')+'。']
        ])}</section>`;
      function renderView() {
        const isUI = view==='ui';
        $('.ep-shell').hidden = !isUI;
        reference.hidden = isUI;
        reference.innerHTML = isUI ? '' : {flow,api,db}[view];
        root.querySelectorAll('button[data-view]').forEach(item=>item.setAttribute('aria-pressed',String(item.dataset.view===view)));
      }
      root.addEventListener('click', event=>{
        const target=event.target.closest('button');
        if(!target) return;
        const {page:next,tab,latestTab:nextLatestTab,view:nextView,action}=target.dataset;
        if(target.hasAttribute('data-close')) closeDialog();
        if(next){page=next;render();remember();}
        if(tab){configTab=tab;render();remember();}
        if(nextLatestTab){latestTab=nextLatestTab;render();}
        if(nextView){view=nextView;renderView();remember();}
        if(action==='query') runQuery();
        if(action==='reset'){fields.reset();runQuery();}
        if(action==='refresh'){showResults();$('.ep-updated').textContent='刷新于 '+now();}
        if(action==='widths'){delete tableWidths[tableKey()]; showResults();}
        if(action==='save') saveDialog();
        if(action==='add') edit();
        if(action?.startsWith('row-')) edit(Number(action.slice(4)));
      });
      content.addEventListener('pointerdown',event=>{
        const dragging = event.target.closest('.ep-resize');
        if(!dragging) return;
        event.preventDefault();
        dragging.setPointerCapture(event.pointerId);
        const header = dragging.parentElement;
        const key = tableKey();
        const original = header.getBoundingClientRect().width;
        const startX = event.clientX;
        const move = next=>{
          const width = Math.max(70,Math.round(original+next.clientX-startX));
          (tableWidths[key] ??= {})[dragging.dataset.column] = width;
          header.style.minWidth = width+'px';
        };
        dragging.addEventListener('pointermove',move);
        dragging.addEventListener('lostpointercapture',()=>dragging.removeEventListener('pointermove',move),{once:true});
      });
      function runQuery() {
        applied=Object.fromEntries(new FormData(fields));
        showResults();
        if(page==='stats') $('.ep-updated').textContent=applied.meter;
      }
      function saveDialog() {
        const form=$('.ep-dialog-form');
        const invalid=$('.ep-dialog-fields [role="alert"]');
        if(saveEdit(Object.fromEntries(new FormData(form)))===false){
          if(!invalid) $('.ep-dialog-fields').insertAdjacentHTML('beforeend','<div class="ep-wide" role="alert">请填写必填字段。</div>');
          return;
        }
        closeDialog();
        showResults();
      }
      for(const [form,submit] of [[fields,runQuery],[$('.ep-dialog-form'),saveDialog]]) {
        form.addEventListener('submit',event=>{event.preventDefault();submit();});
        form.addEventListener('keydown',event=>{
          if(event.key!=='Enter'||event.isComposing||event.target.tagName!=='INPUT') return;
          event.preventDefault();
          submit();
        });
      }
      render();
      renderView();
      window.addEventListener('openai:set_globals',event=>{
        const next=event.detail?.globals?.widgetState?.modelContent;
        if(!next) return;
        if(Object.hasOwn(pages,next.page)) page=next.page;
        if(['metric','source'].includes(next.configTab)) configTab=next.configTab;
        if(['ui','flow','api','db'].includes(next.view)) view=next.view;
        render();
        renderView();
      });
    })();
  </script>
</div>
