<div id="ics-layout-preview" class="viz-carousel" aria-label="通用页面布局与组件示例" data-previous-label="上一个布局" data-next-label="下一个布局">
  <section data-variant="切换上卡＋三栏" aria-label="切换上卡加三栏"></section>
  <section data-variant="单卡三栏" aria-label="单卡三栏" hidden></section>
  <section data-variant="单卡两栏" aria-label="单卡两栏" hidden></section>
  <section data-variant="切换上卡＋两栏" aria-label="切换上卡加两栏" hidden></section>
</div>
<style>
#ics-layout-preview {
  --page: light-dark(#f3f5fa, #191c28);
  --panel: light-dark(#fff, #222635);
  --ink: light-dark(#252a3b, #eef0fa);
  --soft: light-dark(#515a70, #b2bbd2);
  --line: light-dark(#dce0eb, #3f465d);
  --head: light-dark(#f6f7fb, #2a3042);
  --brand: light-dark(#515cbd, #aeb6ff);
  --on-brand: light-dark(#fff, #161b37);
  --tint: light-dark(#eeeffd, #313957);
  --warning-bg: light-dark(#fff3db, #47391f);
  --warning-ink: light-dark(#865000, #ffcf80);
  --good-bg: light-dark(#eaf6ef, #243d33);
  --good-ink: light-dark(#276343, #a0e3bd);
  font: 14px/1.45 system-ui, sans-serif;
}
#ics-layout-preview [data-variant] { min-height: 610px; }
#ics-layout-preview .layout-screen { background: var(--page); color: var(--ink); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
#ics-layout-preview .layout-path { color: var(--soft); margin: 0; }
#ics-layout-preview .layout-card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; min-width: 0; }
#ics-layout-preview .layout-heading { position: relative; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; border-bottom: 1px solid var(--line); }
#ics-layout-preview .layout-title { display: flex; align-items: center; gap: 8px; }
#ics-layout-preview .layout-heading-right { display: flex; align-items: center; justify-content: flex-end; gap: 10px; flex-wrap: wrap; margin-inline-start: auto; }
#ics-layout-preview .layout-heading-status { display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; border-radius: 6px; font-size: 12px; background: var(--good-bg); color: var(--good-ink); }
#ics-layout-preview .layout-heading-status[data-tone="warning"] { background: var(--warning-bg); color: var(--warning-ink); }
#ics-layout-preview .layout-heading-status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
#ics-layout-preview button.layout-help { width: 26px; height: 26px; padding: 0; border-radius: 50%; color: var(--soft); }
#ics-layout-preview .layout-tooltip { position: absolute; z-index: 3; width: max-content; max-width: min(248px, calc(100% - 16px)); box-sizing: border-box; padding: 6px 10px; border: 1px solid light-dark(#353c50, #545d77); border-radius: 7px; background: light-dark(#292f40, #343d55); color: #f8f9ff; box-shadow: 0 4px 12px rgb(0 0 0 / .16); font-size: 12px; line-height: 1.5; overflow-wrap: anywhere; }
#ics-layout-preview .layout-heading h3, #ics-layout-preview .layout-notes h3 { margin: 0; font-size: 15px; font-weight: 650; }
#ics-layout-preview .layout-switch { display: flex; gap: 4px; flex-wrap: wrap; padding: 10px 16px; margin: 0; border: 0; min-width: 0; }
#ics-layout-preview .layout-switch label { position: relative; display: flex; }
#ics-layout-preview .layout-switch input { position: absolute; opacity: 0; }
#ics-layout-preview .layout-switch span { border-radius: 7px; background: var(--head); padding: 6px 11px; }
#ics-layout-preview .layout-switch input:checked + span { background: var(--brand); color: var(--on-brand); }
#ics-layout-preview .layout-switch input:focus-visible + span { outline: 2px solid var(--brand); outline-offset: 2px; }
#ics-layout-preview .layout-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
#ics-layout-preview button.layout-button, #ics-layout-preview input.layout-field, #ics-layout-preview select.layout-field {
  font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 6px 10px; box-sizing: border-box; min-width: 0;
}
#ics-layout-preview button.layout-button { cursor: pointer; }
#ics-layout-preview button.layout-button:hover { border-color: var(--brand); }
#ics-layout-preview button.layout-primary { color: var(--on-brand); background: var(--brand); border-color: var(--brand); }
#ics-layout-preview button.layout-row { padding: 3px 8px; color: var(--brand); }
#ics-layout-preview .layout-filter { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
#ics-layout-preview .layout-label { min-width: 0; display: grid; gap: 4px; color: var(--soft); }
#ics-layout-preview .layout-keyword { flex: 1 1 150px; }
#ics-layout-preview .layout-results { padding: 12px 16px; min-width: 0; }
#ics-layout-preview .layout-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 7px; }
#ics-layout-preview table { border-collapse: collapse; width: 100%; min-width: 345px; }
#ics-layout-preview th, #ics-layout-preview td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
#ics-layout-preview th { background: var(--head); color: var(--soft); font-weight: 600; position: relative; }
#ics-layout-preview tbody tr:last-child td { border-bottom: 0; }
#ics-layout-preview th:last-child { width: 76px; }
#ics-layout-preview .layout-grip { display: block; position: absolute; right: 0; top: 4px; bottom: 4px; width: 9px; cursor: col-resize; touch-action: none; border-right: 1px solid var(--line); }
#ics-layout-preview .layout-grip:hover { border-color: var(--brand); }
#ics-layout-preview .layout-status { display: inline-block; color: var(--soft); background: var(--head); padding: 2px 7px; border-radius: 5px; white-space: nowrap; }
#ics-layout-preview .layout-status[data-enabled] { color: var(--brand); background: var(--tint); }
#ics-layout-preview .layout-count { color: var(--soft); font-size: 12px; margin: 7px 0 0; }
#ics-layout-preview .layout-notes { padding: 14px 3px; }
#ics-layout-preview .layout-notes ul { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 0; margin: 9px 0 0; gap: 8px 20px; list-style: none; }
#ics-layout-preview .layout-notes li { color: var(--soft); }
#ics-layout-preview .layout-notes strong { color: var(--ink); margin-right: 6px; font-weight: 650; }
#ics-layout-preview .layout-rule { margin: 10px 0 0; color: var(--soft); }
#ics-layout-preview dialog { color: var(--ink); background: var(--panel); width: min(360px, calc(100% - 36px)); box-sizing: border-box; padding: 16px; border: 1px solid var(--line); border-radius: 12px; }
#ics-layout-preview dialog form { display: grid; gap: 10px; }
#ics-layout-preview dialog h3 { margin: 0; font-size: 16px; }
#ics-layout-preview dialog::backdrop { background: rgb(15 20 40 / .5); }
@media (max-width: 580px) {
  #ics-layout-preview [data-variant] { min-height: 820px; }
  #ics-layout-preview .layout-screen { padding: 10px; }
  #ics-layout-preview .layout-heading, #ics-layout-preview .layout-results, #ics-layout-preview .layout-filter { padding: 10px; }
  #ics-layout-preview .layout-heading-right { justify-content: flex-start; margin-inline-start: 0; }
  #ics-layout-preview .layout-notes ul { grid-template-columns: 1fr; }
}
</style>
<script>
(() => {
  const root = document.getElementById('ics-layout-preview');
  const curves = {
    title: '曲线设置', key: '曲线组键', scope: '工艺类别', options: ['温控工艺', '传动工艺'],
    rows: [['heatingTemperature', '加热区温度', '温控工艺', true], ['coolingTemperature', '冷却区温度', '温控工艺', true], ['driveSpeed', '辊道速度', '传动工艺', false]]
  };
  const meters = {
    title: '表计指标配置', key: '指标键', scope: '表计', options: ['主线电表', '辅助电表'],
    rows: [['energyInterval', '时段用电量', '主线电表', true], ['energyTotal', '累计用电量', '主线电表', true], ['activePower', '有功功率', '辅助电表', false]]
  };
  const regions = {
    title: '区域配置', key: '区域键', scope: '工艺类别', options: ['温控工艺', '传动工艺'],
    rows: [['heatZone1', '加热区 1', '温控工艺', true], ['heatZone2', '加热区 2', '温控工艺', true], ['mainDrive', '主传动', '传动工艺', false]]
  };
  const metrics = {
    title: '指标设置', key: '指标键', scope: '采样组', options: ['加热区 1', '主传动'],
    rows: [['zone1Actual', '实际温度', '加热区 1', true], ['zone1Set', '设定温度', '加热区 1', true], ['driveSpeed', '实际速度', '主传动', false]]
  };
  const plans = {
    title: '任务计划', key: '任务号', scope: '产线', options: ['涂装线', '包装线'], rowStates: ['已发布', '草稿'],
    rows: [['PL-1121-01', '早班生产计划', '涂装线', true], ['PL-1121-02', '来料验证计划', '包装线', false], ['PL-1121-03', '晚班生产计划', '涂装线', false]]
  };
  const live = {
    title: '实时数据', key: '点位键', scope: '最新值', readOnly: true, rowStates: ['正常', '延迟'],
    rows: [['zone1Actual', '加热区 1 实际温度', '178.6 °C', false], ['zone1Set', '加热区 1 设定温度', '180.0 °C', true], ['driveSpeed', '辊道速度', '32.4 m/min', true]]
  };
  const examples = [
    { path: '过程监控 › 配置管理', family: '曲线与历史管理', filter: true, groups: [curves, meters],
      explanation: '同页有两个可访问的工作区。切换时，主卡标题、操作、筛选字段和表格一起更新。',
      help: '在上方选择配置对象。本表按当前类别查询。' },
    { path: '计划管理 › 任务计划', filter: true, groups: [plans],
      explanation: '任务计划只有一个工作区。产线只是筛选条件，放在主卡第二栏。',
      help: '关键词支持任务号和计划名称。' },
    { path: '采集数据 › 实时数据', filter: false, groups: [live],
      explanation: '示例已经进入单一数据源的实时视图，可以直接查看点位，使用单卡两栏。',
      help: '最新值来自当前数据源。状态延迟时仍显示上次收到的值。',
      status: '采集有延迟' },
    { path: '设备状态 › 配置管理', family: '指标与快照管理', filter: false, groups: [regions, metrics],
      explanation: '区域和指标是两个工作区。示例记录较少，切换后可直接查看各自的表格。',
      help: '宽度偏好按表保留，可以拖动表头边界。' }
  ];
  const button = (text, attributes = '', kind = '') =>
    '<button class="layout-button ' + kind + '" ' + attributes + '>' + text + '</button>';
  const options = (values) => values.map(value => '<option>' + value + '</option>').join('');

  function attachTooltip(header, selector, id) {
    const trigger = header.querySelector(selector);
    const tooltip = header.querySelector('#' + id);
    let pinned = false;
    let closeTimer;
    trigger.setAttribute('aria-describedby', id);

    function show() {
      clearTimeout(closeTimer);
      for (const other of header.querySelectorAll('.layout-tooltip')) other.hidden = other !== tooltip;
      const origin = header.getBoundingClientRect();
      const anchor = trigger.getBoundingClientRect();
      const center = anchor.left - origin.left + anchor.width / 2;
      tooltip.style.left = Math.max(8, Math.min(center - tooltip.offsetWidth / 2, origin.width - tooltip.offsetWidth - 8)) + 'px';
      tooltip.style.top = anchor.bottom - origin.top + 5 + 'px';
    }

    function hide() {
      clearTimeout(closeTimer);
      pinned = false;
      tooltip.hidden = true;
    }

    function scheduleHide() {
      if (!pinned && !trigger.matches(':focus-visible')) closeTimer = setTimeout(hide, 120);
    }

    trigger.addEventListener('pointerenter', event => { if (event.pointerType !== 'touch') show(); });
    trigger.addEventListener('pointerleave', scheduleHide);
    tooltip.addEventListener('pointerenter', () => clearTimeout(closeTimer));
    tooltip.addEventListener('pointerleave', scheduleHide);
    trigger.addEventListener('focus', show);
    trigger.addEventListener('blur', hide);
    trigger.addEventListener('click', () => {
      if (pinned && !tooltip.hidden) hide();
      else {
        pinned = true;
        show();
      }
    });
    header.addEventListener('keydown', event => {
      if (event.key === 'Escape' && !tooltip.hidden) hide();
    });
  }

  root.querySelectorAll('[data-variant]').forEach((panel, index) => {
    const example = examples[index];
    const groups = structuredClone(example.groups).map(group => ({ ...group, filters: ['', ''], width: '' }));
    let active = 0;
    let editing = null;
    panel.innerHTML = `
      <div class="layout-screen">
        <p class="layout-path">${example.path}</p>
        ${example.family ? `<section class="layout-card">
          <header class="layout-heading"><h3>${example.family}</h3></header>
          <fieldset class="layout-switch" aria-label="切换工作区">
            ${groups.map((group, idx) => `<label><input type="radio" name="layout-category-${index}" value="${idx}" ${idx === 0 ? 'checked' : ''}><span>${group.title}</span></label>`).join('')}
          </fieldset>
        </section>` : ''}
        <section class="layout-card layout-main"></section>
        <dialog aria-labelledby="layout-editor-${index}">
          <form>
            <h3 id="layout-editor-${index}"></h3>
            <label class="layout-label"><span data-key-label></span><input class="layout-field" name="recordKey" required maxlength="35"></label>
            <label class="layout-label">名称<input class="layout-field" name="recordName" required maxlength="35"></label>
            <label class="layout-label"><span data-scope-label></span><select class="layout-field" name="recordScope"></select></label>
            <label><input type="checkbox" name="recordEnabled"> <span data-enabled-label></span></label>
            <div class="layout-actions">${button('保存', 'type="button" data-save', 'layout-primary')}${button('取消', 'type="button" data-cancel')}</div>
          </form>
        </dialog>
      </div>
      <aside class="layout-notes" aria-label="布局说明">
        <h3>这个界面怎样分栏</h3>
        <ul>
          <li><strong>上卡</strong>${example.explanation}</li>
          <li><strong>第一栏</strong>标题和帮助靠左，整卡状态在右侧按钮组左边。保留与当前内容相关的动作。${example.status ? '试试点右侧「刷新」。' : ''}</li>
          <li><strong>第二栏</strong>${example.filter ? '放筛选条件和查询动作。「重置」清除条件，恢复这张表的全部示例记录。' : '直接放主体表格。有行级操作时随行放置。'}</li>
          ${example.filter ? '<li><strong>第三栏</strong>显示当前查询结果，单条记录的「编辑」留在该行。</li>' : ''}
        </ul>
        <p class="layout-rule"><strong>状态标签</strong>有整卡状态时显示一个短标签，异常优先。文字和语义色一起表达状态。没有整卡状态时省略标签，记录状态留在表格。</p>
        <p class="layout-rule"><strong>Tooltip</strong>试试标题旁的「?」或「重置列宽」。统一用深色实底、浅色小字和轻圆角，贴近触发项，窄屏避开边缘。悬停、键盘聚焦或点按可读，Esc 关闭。用于术语、图标含义或短补充说明，关键状态和必读信息直接展示。</p>
        <p class="layout-rule"><strong>跨模块复用</strong>根据工作区数量决定上卡，根据有无独立工具区决定两栏或三栏。同一套卡头顺序、按钮层级、间距、状态语义和提示样式适用于所有模块。</p>
      </aside>`;
    const main = panel.querySelector('.layout-main');
    const dialog = panel.querySelector('dialog');
    const editor = dialog.querySelector('form');
    const fields = editor.elements;

    function renderRows() {
      const group = groups[active];
      const [scope, keyword] = group.filters;
      const body = main.querySelector('tbody');
      const rows = group.rows.filter(row => (!scope || row[2] === scope) &&
        (row[0] + ' ' + row[1]).toLowerCase().includes(keyword.toLowerCase()));
      body.replaceChildren();
      for (const row of rows) {
        const tr = body.insertRow();
        for (const value of row.slice(0, 3)) tr.insertCell().textContent = value;
        const status = document.createElement('span');
        status.className = 'layout-status';
        status.toggleAttribute('data-enabled', row[3]);
        status.textContent = (group.rowStates ?? ['已启用', '已停用'])[row[3] ? 0 : 1];
        tr.insertCell().append(status);
        if (group.readOnly) continue;
        const cell = tr.insertCell();
        cell.innerHTML = button('编辑', 'type="button"', 'layout-row');
        cell.firstElementChild.setAttribute('aria-label', '编辑 ' + row[1]);
        cell.firstElementChild.addEventListener('click', () => openEditor(row));
      }
      if (!rows.length) {
        const cell = body.insertRow().insertCell();
        cell.colSpan = group.readOnly ? 4 : 5;
        cell.textContent = group.rows.length ? '没有符合条件的记录' : '暂无配置';
      }
      main.querySelector('.layout-count').textContent = '共 ' + rows.length + ' 条';
    }

    function render() {
      const group = groups[active];
      main.innerHTML = `
        <header class="layout-heading">
          <div class="layout-title"><h3>${group.title}</h3>${button('?', 'type="button" aria-label="关于当前工作区" data-help', 'layout-help')}</div>
          <div class="layout-heading-right">
            ${example.status ? `<span class="layout-heading-status" data-tone="warning" role="status">${example.status}</span>` : ''}
            <div class="layout-actions">
              ${group.readOnly ? '' : button('新增', 'type="button" data-add', 'layout-primary')}
              ${button('重置列宽', 'type="button" data-width')}
              ${group.readOnly ? button('刷新', 'type="button" data-refresh', 'layout-primary') : ''}
            </div>
          </div>
          <div class="layout-tooltip" id="layout-tooltip-help-${index}" role="tooltip" hidden>${example.help}</div>
          <div class="layout-tooltip" id="layout-tooltip-width-${index}" role="tooltip" hidden>恢复当前表的默认列宽</div>
        </header>
        ${example.filter ? `<form class="layout-filter">
          <label class="layout-label">${group.scope}<select class="layout-field" name="scope"><option value="">全部</option>${options(group.options)}</select></label>
          <label class="layout-label layout-keyword">关键词<input name="keyword" class="layout-field" placeholder="按键或名称查找"></label>
          <div class="layout-actions">${button('查询', 'type="button" data-query', 'layout-primary')}${button('重置', 'type="button" data-reset')}</div>
        </form>` : ''}
        <div class="layout-results">
          <div class="layout-scroll">
            <table aria-label="${group.title}">
              <thead><tr><th scope="col" data-key-column>${group.key}<span class="layout-grip" aria-hidden="true"></span></th><th scope="col">名称</th><th scope="col">${group.scope}</th><th scope="col">状态</th>${group.readOnly ? '' : '<th scope="col">操作</th>'}</tr></thead>
              <tbody></tbody>
            </table>
          </div>
          <p class="layout-count" role="status"></p>
        </div>`;
      const form = main.querySelector('.layout-filter');
      if (form) {
        [form.elements.scope.value, form.elements.keyword.value] = group.filters;
        const query = () => {
          group.filters = [form.elements.scope.value, form.elements.keyword.value.trim()];
          renderRows();
        };
        form.querySelector('[data-query]').addEventListener('click', query);
        form.elements.keyword.addEventListener('keydown', event => {
          if (event.key === 'Enter' && !event.isComposing) {
            event.preventDefault();
            query();
          }
        });
        form.querySelector('[data-reset]').addEventListener('click', () => {
          group.filters = ['', ''];
          form.elements.scope.value = '';
          form.elements.keyword.value = '';
          renderRows();
        });
      }
      const column = main.querySelector('[data-key-column]');
      const grip = column.querySelector('.layout-grip');
      column.style.width = group.width;
      grip.addEventListener('pointerdown', event => {
        const startX = event.clientX;
        const startWidth = column.clientWidth;
        grip.setPointerCapture(event.pointerId);
        grip.onpointermove = move => {
          group.width = Math.max(100, startWidth + move.clientX - startX) + 'px';
          column.style.width = group.width;
        };
      });
      grip.addEventListener('lostpointercapture', () => { grip.onpointermove = null; });
      main.querySelector('[data-add]')?.addEventListener('click', () => openEditor(null));
      main.querySelector('[data-width]').addEventListener('click', () => { group.width = ''; column.style.width = ''; });
      const header = main.querySelector('.layout-heading');
      attachTooltip(header, '[data-help]', 'layout-tooltip-help-' + index);
      attachTooltip(header, '[data-width]', 'layout-tooltip-width-' + index);
      main.querySelector('[data-refresh]')?.addEventListener('click', () => {
        group.rows[0][2] = '179.1 °C';
        group.rows[0][3] = true;
        const status = header.querySelector('.layout-heading-status');
        status.dataset.tone = 'good';
        status.textContent = '采集正常';
        renderRows();
      });
      renderRows();
    }

    function openEditor(row) {
      const group = groups[active];
      editing = row;
      editor.querySelector('h3').textContent = (row ? '编辑 · ' : '新增 · ') + group.title;
      editor.querySelector('[data-key-label]').textContent = group.key;
      editor.querySelector('[data-scope-label]').textContent = group.scope;
      fields.recordKey.value = row?.[0] ?? '';
      fields.recordKey.readOnly = Boolean(row);
      fields.recordKey.setCustomValidity('');
      fields.recordName.value = row?.[1] ?? '';
      fields.recordName.setCustomValidity('');
      fields.recordScope.innerHTML = options(group.options);
      fields.recordScope.value = row?.[2] ?? group.options[0];
      editor.querySelector('[data-enabled-label]').textContent = group.rowStates ? '发布' : '启用';
      fields.recordEnabled.checked = row?.[3] ?? true;
      dialog.showModal();
    }
    fields.recordKey.addEventListener('input', () => fields.recordKey.setCustomValidity(''));
    fields.recordName.addEventListener('input', () => fields.recordName.setCustomValidity(''));
    editor.querySelector('[data-cancel]').addEventListener('click', () => dialog.close());
    function saveRecord() {
      if (!editor.reportValidity()) return;
      const group = groups[active];
      const key = fields.recordKey.value.trim();
      const name = fields.recordName.value.trim();
      if (!key || (!editing && group.rows.some(row => row[0] === key))) {
        fields.recordKey.setCustomValidity(key ? '这个键已存在' : '请输入有效的键');
        fields.recordKey.reportValidity();
        return;
      }
      if (!name) {
        fields.recordName.setCustomValidity('请输入有效的名称');
        fields.recordName.reportValidity();
        return;
      }
      const record = [key, name, fields.recordScope.value, fields.recordEnabled.checked];
      if (editing) group.rows[group.rows.indexOf(editing)] = record;
      else group.rows.push(record);
      dialog.close();
      renderRows();
    }
    editor.querySelector('[data-save]').addEventListener('click', saveRecord);
    editor.addEventListener('keydown', event => {
      if (event.key === 'Enter' && !event.isComposing && event.target.matches('input.layout-field')) {
        event.preventDefault();
        saveRecord();
      }
    });
    panel.querySelector('.layout-switch')?.addEventListener('change', event => {
      active = Number(event.target.value);
      render();
    });
    render();
  });
})();
</script>
