<div id="ics-layout-preview" class="viz-carousel" aria-label="通用页面布局与组件示例" data-previous-label="上一个布局" data-next-label="下一个布局">
  <section data-variant="三栏与四栏弹窗" aria-label="三栏与四栏弹窗"></section>
  <section data-variant="单卡两栏" aria-label="单卡两栏" hidden></section>
  <section data-variant="单卡三栏" aria-label="单卡三栏" hidden></section>
  <section data-variant="切换上卡＋三栏" aria-label="切换上卡加三栏" hidden></section>
  <section data-variant="切换上卡＋两栏" aria-label="切换上卡加两栏" hidden></section>
</div>
<style>
#ics-layout-preview {
  --page: light-dark(#f5f6f8, #08090a);
  --panel: light-dark(rgb(255 255 255 / .8), rgb(255 255 255 / .03));
  --dialog: light-dark(#fff, #101113);
  --ink: light-dark(#14171f, #f7f8f8);
  --soft: light-dark(#4e5562, #cfd4dc);
  --tertiary: light-dark(#707887, #8a8f98);
  --line: light-dark(rgb(17 24 39 / .08), rgb(255 255 255 / .08));
  --hairline: light-dark(rgb(17 24 39 / .05), rgb(255 255 255 / .05));
  --strong-line: light-dark(rgb(17 24 39 / .12), rgb(255 255 255 / .14));
  --head: light-dark(rgb(17 24 39 / .025), rgb(255 255 255 / .03));
  --overlay: light-dark(rgb(255 255 255 / .72), rgb(15 16 17 / .7));
  --field: light-dark(rgb(255 255 255 / .92), rgb(255 255 255 / .02));
  --brand: light-dark(#5e6ad2, #7170ff);
  --brand-hover: light-dark(#717dff, #828fff);
  --on-brand: light-dark(#f7f8f8, #08090a);
  --tint: light-dark(rgb(94 106 210 / .12), rgb(113 112 255 / .14));
  --warning-bg: light-dark(#fff3db, #47391f);
  --warning-ink: light-dark(#865000, #ffcf80);
  --good-bg: light-dark(#eaf6ef, #243d33);
  --good-ink: light-dark(#276343, #a0e3bd);
  --tooltip-bg: var(--ink);
  --tooltip-ink: light-dark(#f7f8f8, #191a1b);
  --row-end: light-dark(#fff, #151617);
  font: 14px/1.45 "Inter Variable", Inter, "PingFang SC", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
#ics-layout-preview [data-variant] { min-height: 640px; }
#ics-layout-preview .layout-screen { background: var(--page); color: var(--ink); padding: 16px; display: grid; gap: 16px; min-width: 0; }
#ics-layout-preview .layout-path { color: var(--tertiary); margin: 0; }
#ics-layout-preview .layout-card { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; box-shadow: 0 1px 2px light-dark(rgb(15 23 42 / .05), rgb(0 0 0 / .3)); min-width: 0; }
#ics-layout-preview .layout-heading { position: relative; min-height: 68px; box-sizing: border-box; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px 16px; border-bottom: 1px solid var(--hairline); }
#ics-layout-preview .layout-switch-card .layout-heading { min-height: 56px; padding: 10px 18px; }
#ics-layout-preview .layout-title { display: flex; align-items: center; gap: 12px; }
#ics-layout-preview .layout-heading-right { display: flex; align-items: center; justify-content: flex-end; gap: 10px; flex-wrap: wrap; margin-inline-start: auto; }
#ics-layout-preview button.layout-heading-status { display: inline-flex; align-items: center; gap: 7px; min-height: 28px; padding: 0 9px; border-radius: 999px; border: 1px solid color-mix(in srgb, currentColor 22%, transparent); font: inherit; font-size: 12px; font-weight: 590; background: var(--good-bg); color: var(--good-ink); }
#ics-layout-preview button.layout-heading-status[data-tone="warning"] { background: var(--warning-bg); color: var(--warning-ink); }
#ics-layout-preview button.layout-heading-status::before, #ics-layout-preview .layout-state-dot { content: ""; display: inline-block; flex: 0 0 6px; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
#ics-layout-preview .layout-status-chevron { width: 5px; height: 5px; margin: -3px 2px 0 3px; border: solid currentColor; border-width: 0 1px 1px 0; transform: rotate(45deg); }
#ics-layout-preview [aria-expanded="true"] .layout-status-chevron { margin-top: 2px; transform: rotate(225deg); }
#ics-layout-preview .layout-status-panel { position: absolute; z-index: 5; width: min(224px, calc(100% - 20px)); box-sizing: border-box; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: light-dark(#fff, #1a1b1d); color: var(--soft); box-shadow: 0 8px 20px light-dark(rgb(15 23 42 / .08), rgb(0 0 0 / .3)); font-size: 12px; }
#ics-layout-preview .layout-status-caption { margin: 0 0 5px; color: var(--tertiary); font-size: 12px; font-weight: 510; }
#ics-layout-preview .layout-state-list { margin: 0; }
#ics-layout-preview .layout-state-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 7px 0; }
#ics-layout-preview .layout-state-row + .layout-state-row { border-top: 1px solid var(--hairline); }
#ics-layout-preview .layout-state-row:last-child { padding-bottom: 2px; }
#ics-layout-preview .layout-state-row dd { margin: 0; color: var(--ink); text-align: right; font-variant-numeric: tabular-nums; }
#ics-layout-preview .layout-state-row dd[data-tone="good"] { color: var(--good-ink); }
#ics-layout-preview .layout-state-row dd[data-tone="warning"] { color: var(--warning-ink); }
#ics-layout-preview .layout-state-dot { margin-inline-end: 5px; vertical-align: 1px; }
#ics-layout-preview button.layout-help { display: inline-grid; place-items: center; flex: 0 0 24px; width: 24px; height: 24px; padding: 0; border: 0; border-radius: 50%; color: var(--soft); background: transparent; }
#ics-layout-preview button.layout-help:hover { color: var(--brand); }
#ics-layout-preview button.layout-help:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
#ics-layout-preview .layout-help-glyph { display: grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; background: currentColor; }
#ics-layout-preview .layout-help-glyph b { font-size: 12px; line-height: 1; color: var(--dialog); font-weight: 650; }
#ics-layout-preview .layout-tooltip { position: absolute; isolation: isolate; z-index: 4; width: max-content; max-width: min(364px, calc(100% - 20px)); box-sizing: border-box; padding: 5px 11px; border: 1px solid var(--tooltip-bg); border-radius: 4px; background: var(--tooltip-bg); color: var(--tooltip-ink); font-size: 12px; line-height: 20px; overflow-wrap: anywhere; }
#ics-layout-preview .layout-tooltip::before { content: ""; position: absolute; z-index: -1; left: var(--arrow-left); width: 10px; height: 10px; background: var(--tooltip-bg); transform: translateX(-50%) rotate(45deg); }
#ics-layout-preview .layout-tooltip[data-placement="bottom-start"]::before { top: -5px; }
#ics-layout-preview .layout-tooltip[data-placement="top"]::before { bottom: -5px; }
#ics-layout-preview .layout-heading h3, #ics-layout-preview .layout-notes h3 { margin: 0; font-size: 16px; font-weight: 590; line-height: 1.35; }
#ics-layout-preview .layout-switch { display: inline-flex; gap: 4px; flex-wrap: wrap; max-width: calc(100% - 36px); box-sizing: border-box; padding: 3px; margin: 14px 18px 18px; border: 1px solid var(--line); border-radius: 12px; background: var(--overlay); min-width: 0; }
#ics-layout-preview .layout-switch label { position: relative; display: flex; }
#ics-layout-preview .layout-switch input { position: absolute; opacity: 0; }
#ics-layout-preview .layout-switch span { border-radius: 9px; padding: 0 13px; line-height: 26px; font-size: 12px; font-weight: 510; color: var(--soft); }
#ics-layout-preview .layout-switch input:checked + span { background: var(--brand); color: var(--on-brand); box-shadow: 0 8px 18px rgb(94 106 210 / .22); }
#ics-layout-preview .layout-switch input:focus-visible + span { outline: 2px solid var(--brand); outline-offset: 2px; }
#ics-layout-preview .layout-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
#ics-layout-preview button.layout-button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; box-sizing: border-box; min-height: 40px; border-radius: 14px; padding: 0 18px; color: var(--soft); background: var(--overlay); border: 1px solid var(--line); font: inherit; font-weight: 590; }
#ics-layout-preview button.layout-button:not(.layout-help):hover { border-color: var(--strong-line); background: var(--tint); color: var(--brand); }
#ics-layout-preview button.layout-primary { padding: 0 20px; color: var(--on-brand); background: var(--brand); border-color: transparent; box-shadow: 0 14px 30px rgb(94 106 210 / .22); }
#ics-layout-preview button.layout-primary:not(.layout-help):hover, #ics-layout-preview button.layout-row:not(.layout-help):hover { color: var(--on-brand); background: var(--brand-hover); border-color: transparent; }
#ics-layout-preview button.layout-refresh { color: var(--brand); }
#ics-layout-preview button.layout-row { min-width: 48px; min-height: 24px; height: 24px; border-radius: 8px; padding: 0 7px; font-size: 12px; font-weight: 510; background: var(--brand); color: var(--on-brand); border-color: var(--brand); box-shadow: none; }
#ics-layout-preview button.layout-button.layout-help { min-height: 24px; border: 0; border-radius: 50%; padding: 0; background: transparent; color: var(--soft); }
#ics-layout-preview button.layout-button.layout-help:hover { color: var(--brand); }
#ics-layout-preview input.layout-field, #ics-layout-preview select.layout-field { box-sizing: border-box; min-width: 0; min-height: 32px; border-radius: 12px; border: 1px solid var(--line); padding: 0 11px; font: inherit; color: var(--ink); background: var(--field); }
#ics-layout-preview input.layout-field:focus, #ics-layout-preview select.layout-field:focus { outline: 1px solid var(--brand); outline-offset: -1px; }
#ics-layout-preview .layout-filter { padding: 16px 24px; border-bottom: 1px solid var(--hairline); display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
#ics-layout-preview .layout-label { min-width: 0; display: grid; gap: 8px; color: var(--soft); }
#ics-layout-preview .layout-keyword { flex: 1 1 150px; }
#ics-layout-preview .layout-results { padding: 20px 24px 24px; min-width: 0; }
#ics-layout-preview .layout-scroll { overflow-x: auto; border: 1px solid var(--hairline); }
#ics-layout-preview table { border-collapse: collapse; width: 100%; min-width: 345px; color: var(--soft); }
#ics-layout-preview th, #ics-layout-preview td { text-align: left; padding: 14px 12px; border-bottom: 1px solid var(--hairline); border-right: 1px solid var(--hairline); overflow-wrap: anywhere; }
#ics-layout-preview th { color: var(--tertiary); font-weight: 510; position: relative; letter-spacing: -.01em; }
#ics-layout-preview tbody tr:nth-child(even) { background: var(--head); }
#ics-layout-preview tbody tr:last-child td { border-bottom: 0; }
#ics-layout-preview th:last-child, #ics-layout-preview td:last-child { border-right: 0; }
#ics-layout-preview .layout-operation { width: 76px; text-align: center; position: sticky; right: 0; background: var(--row-end); box-shadow: -1px 0 var(--hairline); }
#ics-layout-preview th.layout-operation { z-index: 1; }
#ics-layout-preview .layout-record-actions { width: 114px; }
#ics-layout-preview .layout-record-actions .layout-actions { justify-content: center; gap: 8px; flex-wrap: nowrap; }
#ics-layout-preview .layout-grip { display: block; position: absolute; right: 0; top: 4px; bottom: 4px; width: 9px; cursor: col-resize; touch-action: none; }
#ics-layout-preview .layout-grip:hover { border-right: 1px solid var(--brand); }
#ics-layout-preview .layout-status { display: inline-block; color: var(--soft); background: var(--head); padding: 2px 7px; border-radius: 5px; white-space: nowrap; }
#ics-layout-preview .layout-status[data-enabled] { color: var(--good-ink); background: var(--good-bg); }
#ics-layout-preview .layout-count { color: var(--tertiary); font-size: 12px; margin: 12px 0 0; text-align: right; }
#ics-layout-preview .layout-notes { padding: 14px 3px; }
#ics-layout-preview .layout-notes ul { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 0; margin: 9px 0 0; gap: 8px 20px; list-style: none; }
#ics-layout-preview .layout-notes li { color: var(--soft); }
#ics-layout-preview .layout-notes strong { color: var(--ink); margin-right: 6px; font-weight: 650; }
#ics-layout-preview .layout-rule { margin: 10px 0 0; color: var(--soft); }
#ics-layout-preview .layout-dialog { color: var(--ink); background: var(--dialog); width: min(760px, calc(100% - 32px)); max-width: none; max-height: min(720px, calc(100dvh - 32px)); box-sizing: border-box; padding: 0; border: 1px solid var(--line); border-radius: 24px; overflow: hidden; box-shadow: 0 24px 60px light-dark(rgb(15 23 42 / .18), rgb(0 0 0 / .48)); }
#ics-layout-preview .layout-dialog[open] { display: flex; flex-direction: column; }
#ics-layout-preview .layout-dialog::backdrop { background: rgb(15 23 42 / .48); }
#ics-layout-preview .layout-dialog .layout-heading { flex: 0 0 auto; }
#ics-layout-preview .layout-dialog .layout-heading > .layout-actions { margin-inline-start: auto; justify-content: flex-end; }
#ics-layout-preview .layout-dialog-tools { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: end; padding: 14px 24px; border-bottom: 1px solid var(--hairline); }
#ics-layout-preview .layout-dialog-content { min-height: 0; overflow: auto; padding: 18px 24px; }
#ics-layout-preview .layout-dialog-footer { flex: 0 0 auto; display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 10px; padding: 14px 24px; border-top: 1px solid var(--hairline); }
#ics-layout-preview .layout-dialog-fields { display: grid; gap: 14px; margin: 0; }
#ics-layout-preview .layout-dialog-fields textarea { font: inherit; color: var(--ink); background: var(--field); border: 1px solid var(--line); border-radius: 12px; padding: 8px 11px; min-height: 76px; box-sizing: border-box; resize: vertical; }
#ics-layout-preview .layout-dialog-section + .layout-dialog-section { border-top: 1px solid var(--hairline); margin-top: 16px; padding-top: 16px; }
#ics-layout-preview .layout-dialog-section h4 { margin: 0 0 10px; color: var(--ink); font-size: 14px; font-weight: 590; }
#ics-layout-preview .layout-dialog-facts { margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
#ics-layout-preview .layout-dialog-facts dt, #ics-layout-preview .layout-metric-key { color: var(--tertiary); font-size: 12px; }
#ics-layout-preview .layout-dialog-facts dd { margin: 3px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
#ics-layout-preview .layout-dialog-facts .layout-fact-wide { grid-column: 1 / -1; }
#ics-layout-preview .layout-order { width: 74px; }
#ics-layout-preview .layout-metric-switch { appearance: none; position: relative; width: 36px; height: 20px; margin: 0; border: 1px solid var(--strong-line); border-radius: 999px; background: var(--head); vertical-align: middle; }
#ics-layout-preview .layout-metric-switch::before { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--tertiary); }
#ics-layout-preview .layout-metric-switch:checked { background: var(--brand); border-color: var(--brand); }
#ics-layout-preview .layout-metric-switch:checked::before { left: 18px; background: var(--on-brand); }
#ics-layout-preview .layout-dialog td { padding-block: 10px; }
@media (max-width: 580px) {
  #ics-layout-preview [data-variant] { min-height: 900px; }
  #ics-layout-preview .layout-screen { padding: 10px; }
  #ics-layout-preview .layout-heading, #ics-layout-preview .layout-results, #ics-layout-preview .layout-filter { padding: 12px 16px; }
  #ics-layout-preview .layout-heading-right { justify-content: flex-end; margin-inline-start: auto; }
  #ics-layout-preview .layout-notes ul { grid-template-columns: 1fr; }
  #ics-layout-preview .layout-dialog-tools, #ics-layout-preview .layout-dialog-content, #ics-layout-preview .layout-dialog-footer { padding: 12px 16px; }
}
</style>
<script>
(() => {
  const root = document.getElementById('ics-layout-preview');
  const curves = {
    title: '曲线设置', key: '曲线组键', scope: '工艺类别', options: ['温控工艺', '传动工艺'],
    rows: [['heatingTemperature', '加热区温度', '温控工艺', true], ['coolingTemperature', '冷却区温度', '温控工艺', true], ['driveSpeed', '辊道速度', '传动工艺', false]]
  };
  const meters = {
    title: '表计指标配置', key: '指标键', scope: '表计', options: ['主线电表', '辅助电表'],
    rows: [['energyInterval', '时段用电量', '主线电表', true], ['energyTotal', '累计用电量', '主线电表', true], ['activePower', '有功功率', '辅助电表', false]]
  };
  const regions = {
    title: '区域配置', key: '区域键', scope: '工艺类别', options: ['温控工艺', '传动工艺'],
    rows: [['heatZone1', '加热区 1', '温控工艺', true], ['heatZone2', '加热区 2', '温控工艺', true], ['mainDrive', '主传动', '传动工艺', false]]
  };
  const metrics = {
    title: '指标设置', key: '指标键', scope: '采样组', options: ['加热区 1', '主传动'],
    rows: [['zone1Actual', '实际温度', '加热区 1', true], ['zone1Set', '设定温度', '加热区 1', true], ['driveSpeed', '实际速度', '主传动', false]]
  };
  const plans = {
    title: '计划管理', key: '任务号', scope: '产线', options: ['涂装线', '包装线'], rowStates: ['已发布', '草稿'],
    rows: [['PL-1121-01', '早班生产计划', '涂装线', true], ['PL-1121-02', '来料验证计划', '包装线', false], ['PL-1121-03', '晚班生产计划', '涂装线', false]]
  };
  const live = {
    title: '实时数据', key: '点位键', scope: '最新值', readOnly: true, rowStates: ['正常', '延迟'],
    rows: [['zone1Actual', '加热区 1 实际温度', '178.6 °C', false], ['zone1Set', '加热区 1 设定温度', '180.0 °C', true], ['driveSpeed', '辊道速度', '32.4 m/min', true]]
  };
  const examples = [
    { path: '采集数据 › 实时数据', filter: false, groups: [live],
      explanation: '示例已经进入单一数据源的实时视图，可以直接查看点位，使用单卡两栏。',
      help: '最新值来自当前数据源。状态延迟时仍显示上次收到的值。',
      status: '采集有延迟' },
    { path: '计划管理 › 计划列表', filter: true, groups: [plans], plan: true,
      explanation: '计划列表只有一个工作区。多项查询条件集中放在第二栏。',
      help: '业务时间为上海时间（UTC+08:00）。观测时间来自最近一次上报，更新时间表示该记录实际保存变化的时间。' },
    { path: '过程监控 › 配置管理', family: '曲线与历史管理', filter: true, groups: [curves, meters],
      explanation: '同页有两个可访问的工作区。切换时，主卡标题、操作、筛选字段和表格一起更新。',
      help: '在上方选择配置对象。本表按当前类别查询。' },
    { path: '设备状态 › 配置管理', family: '指标与快照管理', filter: false, groups: [regions, metrics],
      explanation: '区域和指标是两个工作区。示例记录较少，切换后可直接查看各自的表格。',
      help: '宽度偏好按表保留，可以拖动表头边界。' }
  ];
  const button = (text, attributes = '', kind = '') =>
    '<button class="layout-button ' + kind + '" ' + attributes + '>' + text + '</button>';
  const options = (values) => values.map(value => '<option>' + value + '</option>').join('');
  const dialogHeader = (title, actions = '') => `<header class="layout-heading"><h3>${title}</h3>${actions ? '<div class="layout-actions">' + actions + '</div>' : ''}</header>`;
  const dialogFooter = (edit = true) => `<footer class="layout-dialog-footer">${button(edit ? '取消' : '关闭', 'type="button" data-cancel')}${edit ? button('保存', 'type="button" data-save', 'layout-primary') : ''}</footer>`;

  const dialogExample = root.querySelector('[data-variant="三栏与四栏弹窗"]');
  dialogExample.innerHTML = `
    <div class="layout-screen">
      <p class="layout-path">过程监控 › 数据管理</p>
      <section class="layout-card">
        <header class="layout-heading">
          <h3>过程采集记录</h3>
          <div class="layout-actions">${button('指标列设置', 'type="button" data-open="batch"')}</div>
        </header>
        <div class="layout-results">
          <div class="layout-scroll"><table aria-label="过程采集记录">
            <thead><tr><th scope="col">任务号</th><th scope="col">设备</th><th scope="col">采集时间</th><th scope="col">复核标记</th><th scope="col" class="layout-operation layout-record-actions">操作</th></tr></thead>
            <tbody><tr><td>PL-1121-01</td><td>涂装线</td><td>2026-11-21 10:32:17</td><td data-record-mark>待复核</td>
              <td class="layout-operation layout-record-actions"><div class="layout-actions">
                ${button('查看', 'type="button" data-open="view"', 'layout-row')}${button('操作', 'type="button" data-open="edit"', 'layout-row')}
              </div></td></tr></tbody>
          </table></div>
          <p class="layout-count" role="status">共 1 条</p>
        </div>
      </section>
      <dialog class="layout-dialog" data-dialog="batch" aria-label="指标列设置">
        ${dialogHeader('指标列设置', button('刷新','type="button" data-refresh', 'layout-refresh'))}
        <div class="layout-dialog-tools" aria-label="筛选指标">
          <label class="layout-label">采样组<select class="layout-field" name="scope"><option value="">全部</option><option>温控</option><option>传动</option></select></label>
          <label class="layout-label layout-keyword">关键词<input class="layout-field" name="keyword" placeholder="按指标名或键查找"></label>
          <div class="layout-actions">${button('查询','type="button" data-query','layout-primary')}${button('重置','type="button" data-reset')}</div>
        </div>
        <div class="layout-dialog-content">
          <div class="layout-scroll"><table aria-label="指标列">
            <thead><tr><th scope="col">指标</th><th scope="col">写入启用</th><th scope="col">显示列</th><th scope="col">列顺序</th></tr></thead>
            <tbody></tbody>
          </table></div>
          <p class="layout-count" role="status"></p>
        </div>
        ${dialogFooter()}
      </dialog>
      <dialog class="layout-dialog" data-dialog="edit" aria-label="采集记录操作">

  function attachTooltip(header, selector, id) {
    const trigger = header.querySelector(selector);
    const tooltip = header.querySelector('#' + id);
    let pinned = false;
    let closeTimer;
    trigger.setAttribute('aria-describedby', id);

    function show() {
      clearTimeout(closeTimer);
      for (const other of header.querySelectorAll('.layout-tooltip')) other.hidden = other !== tooltip;
      const origin = header.getBoundingClientRect();
      const anchor = trigger.getBoundingClientRect();
      const center = anchor.left - origin.left + anchor.width / 2;
      const preferred = selector === '[data-help]' ? anchor.left - origin.left : center - tooltip.offsetWidth / 2;
      const above = selector !== '[data-help]' && anchor.top > tooltip.offsetHeight + 16;
      const left = Math.max(10, Math.min(preferred, origin.width - tooltip.offsetWidth - 10));
      tooltip.dataset.placement = above ? 'top' : 'bottom-start';
      tooltip.style.left = left + 'px';
      tooltip.style.top = (above ? anchor.top - origin.top - tooltip.offsetHeight - 12 : anchor.bottom - origin.top + 12) + 'px';
      tooltip.style.setProperty('--arrow-left', Math.max(10, Math.min(tooltip.offsetWidth - 10, center - left)) + 'px');
    }

    function hide() {
      clearTimeout(closeTimer);
      pinned = false;
      tooltip.hidden = true;
    }

    function scheduleHide() {
      if (!pinned && !trigger.matches(':focus-visible')) closeTimer = setTimeout(hide, 160);
    }

    trigger.addEventListener('pointerenter', event => { if (event.pointerType !== 'touch') show(); });
    trigger.addEventListener('pointerleave', scheduleHide);
    tooltip.addEventListener('pointerenter', () => clearTimeout(closeTimer));
    tooltip.addEventListener('pointerleave', scheduleHide);
    trigger.addEventListener('focus', show);
    trigger.addEventListener('blur', hide);
    trigger.addEventListener('click', () => {
      if (pinned && !tooltip.hidden) hide();
      else {
        pinned = true;
        show();
      }
    });
    header.addEventListener('keydown', event => {
      if (event.key === 'Escape' && !tooltip.hidden) hide();
    });
  }

  function attachStatusPanel(header) {
    const trigger = header.querySelector('[data-status-toggle]');
    const details = header.querySelector('.layout-status-panel');
    let pinned = false;
    let closeTimer;

    function setOpen(open) {
      clearTimeout(closeTimer);
      trigger.setAttribute('aria-expanded', String(open));
      details.hidden = !open;
      if (!open) {
        pinned = false;
        return;
      }
      const origin = header.getBoundingClientRect();
      const anchor = trigger.getBoundingClientRect();
      details.style.left = Math.max(10, Math.min(anchor.right - origin.left - details.offsetWidth, origin.width - details.offsetWidth - 10)) + 'px';
      details.style.top = anchor.bottom - origin.top + 8 + 'px';
    }

    for (const target of [trigger, details]) {
      target.addEventListener('pointerenter', event => {
        if (event.pointerType === 'mouse') setOpen(true);
      });
      target.addEventListener('pointerleave', () => {
        if (!pinned) closeTimer = setTimeout(() => setOpen(false), 180);
      });
    }
    trigger.addEventListener('click', () => {
      if (pinned) setOpen(false);
      else {
        pinned = true;
        setOpen(true);
      }
    });
    document.addEventListener('pointerdown', event => {
      if (!details.hidden && !trigger.contains(event.target) && !details.contains(event.target)) setOpen(false);
    });
    document.addEventListener('focusin', event => {
      if (!details.hidden && !trigger.contains(event.target) && !details.contains(event.target)) setOpen(false);
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && !details.hidden) setOpen(false);
    });
    window.addEventListener('resize', () => {
      if (!details.hidden) setOpen(true);
    });
  }

      fields.recordKey.readOnly = Boolean(row);
      fields.recordKey.setCustomValidity('');
      fields.recordName.value = row?.[1] ?? '';
      fields.recordName.setCustomValidity('');
      fields.recordScope.innerHTML = options(group.options);
      fields.recordScope.value = row?.[2] ?? group.options[0];
      editor.querySelector('[data-enabled-label]').textContent = group.rowStates ? '发布' : '启用';
      fields.recordEnabled.checked = row?.[3] ?? true;
      dialog.showModal();
    }
    fields.recordKey.addEventListener('input', () => fields.recordKey.setCustomValidity(''));
    fields.recordName.addEventListener('input', () => fields.recordName.setCustomValidity(''));
    dialog.querySelector('[data-cancel]').addEventListener('click', () => dialog.close());
    settings?.querySelector('[data-cancel]').addEventListener('click', () => settings.close());
    settings?.querySelector('[data-save]').addEventListener('click', () => {
      showScope = settings.querySelector('[data-show-scope]').checked;
      settings.close();
      renderRows();
    });
    function saveRecord() {
      if (!editor.reportValidity()) return;
      const group = groups[active];
      const key = fields.recordKey.value.trim();
      const name = fields.recordName.value.trim();
      if (!key || (!editing && group.rows.some(row => row[0] === key))) {
        fields.recordKey.setCustomValidity(key ? '这个键已存在' : '请输入有效的键');
        fields.recordKey.reportValidity();
        return;
      }
      if (!name) {
        fields.recordName.setCustomValidity('请输入有效的名称');
        fields.recordName.reportValidity();
        return;
      }
      const record = [key, name, fields.recordScope.value, fields.recordEnabled.checked];
      if (editing) group.rows[group.rows.indexOf(editing)] = record;
      else group.rows.push(record);
      dialog.close();
      renderRows();
    }
    dialog.querySelector('[data-save]').addEventListener('click', saveRecord);
    editor.addEventListener('keydown', event => {
      if (event.key === 'Enter' && !event.isComposing && event.target.matches('input.layout-field')) {
        event.preventDefault();
        saveRecord();
      }
    });
    panel.querySelector('.layout-switch')?.addEventListener('change', event => {
      active = Number(event.target.value);
      render();
    });
    render();
  });
})();
</script>
