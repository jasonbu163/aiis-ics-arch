# Accepted ARCH-DOCKER-001 r1 disposable MySQL runtime proof.
name: aiis-ics-arch-smoke

x-backend-smoke: &backend-smoke
  image: aiis-ics-arch-smoke-backend:local
  build:
    context: ./backend
    dockerfile: Dockerfile
  env_file:
    - ./backend/.env.docker.smoke
  networks:
    - smoke

services:
  mysql:
    image: mysql:8.4.6
    restart: unless-stopped
    env_file:
      - ./backend/.env.docker.smoke
    environment:
      MYSQL_ROOT_HOST: "%"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - smoke
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_ROOT_USER:-root} -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  migration:
    <<: *backend-smoke
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]

  backend:
    <<: *backend-smoke
    restart: unless-stopped
    depends_on:
      migration:
        condition: service_completed_successfully
    ports:
      - "${SMOKE_BACKEND_PORT:-18000}:8000"

  frontend:
    image: aiis-ics-arch-smoke-frontend:local
    build:
      context: ./frontend-js
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_PROXY_TARGET: http://backend:8000
        VITE_FRONTEND_MOCK_ENABLED: "false"
        VITE_ROLE_PAGE_ACCESS_JSON: "{}"
        VITE_LOGIN_DEMO_ACCOUNTS_ENABLED: "false"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "${SMOKE_FRONTEND_PORT:-18080}:80"
    networks:
      - smoke

networks:
  smoke:
    driver: bridge

volumes:
  mysql_data:
