# DS唯一产品runtime，由正式桌面与非默认测试宿主共享。
[package]
name = "ds-runtime"
version = "0.1.0"
edition = "2021"
autobins = false
build = "build.rs"
links = "ds_s7_native"
[features]
default = ["native-s7"]
native-s7 = []
test-automation = ["native-s7"]
[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
libc = "=0.2.186"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt", "json"] }
tracing-appender = "=0.2.5"

rusqlite = { version = "=0.32.1", features = ["bundled"] }
uuid = { version = "=1.23.3", features = ["v4"] }
fs2 = "=0.4.3"
aiis-tia-import-core = { version = "=0.1.0", path = "../../shared/tia-import-core" }

[[bin]]
name="ds-test-host"
path="src/bin/ds-test-host.rs"
required-features=["test-automation"]
