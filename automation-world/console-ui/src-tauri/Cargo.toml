[package]
name = "aiis-aw-console-ui"
version = "0.1.0"
description = "AIIS AW Console UI design workbench"
authors = ["AIIS ICS Contributors"]
edition = "2021"
default-run = "aiis-aw-console-ui"
autobins = false

[[bin]]
name = "aiis-aw-console-ui"
path = "src/main.rs"

[lib]
name = "aiis_aw_console_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "json"] }
