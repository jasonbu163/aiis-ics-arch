# 单机交付：镜像内 backend 源码 + 宿主机预构建 dist + 外部数据库。
# 先按 INITIALIZATION 准备真实 env、runtime/backend/logs 与 dist/index.html。
name: aiis-ics-arch-prod

services:
  backend:
    image: aiis-ics-arch-prod-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    volumes:
      - type: bind
        source: ./backend/.env.docker.prod
        target: /app/.env
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./runtime/backend/logs
        target: /app/logs
        bind:
          create_host_path: false

  frontend:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_HOST_PORT:-80}:80"
    volumes:
      - type: bind
        source: ./frontend-js/dist
        target: /usr/share/nginx/html/current
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./frontend-js/nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
    command:
      - /bin/sh
      - -c
      - >-
        test -f /usr/share/nginx/html/current/index.html
        || { echo 'frontend-js/dist/index.html is missing; run pnpm --dir frontend-js build first.' >&2; exit 1; };
        exec nginx -g 'daemon off;'
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
